  <input id="glos-busca" class="busca" type="search" placeholder="Buscar termo… (ex.: dropout, recall)" autocomplete="off"><div data-o="l"></div>`;
  const L = $('[data-o=l]', M);
  const draw = q => {
    const n = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const it = GLOS.filter(g => !q || n(g.join(' ')).includes(n(q)));
    L.innerHTML = it.length ? '<div class="glist">' + it.map(g => `<div class="card gl"><h3>${g[0]}</h3>${explain(g[1], g[2])}</div>`).join('') + '</div>' : '<p class="muted">Nenhum termo encontrado.</p>';
  };
  $('#glos-busca', M).oninput = e => draw(e.target.value); draw('');
}

/* ================= QUESTÕES ================= */
const ALLQ = AULAS.flatMap(a => a.quiz.map(q => Object.assign(q, { aula: a.id })));
const QBY = Object.fromEntries(ALLQ.map(q => [q.id, q]));
const LETTERS = 'ABCDEF';
function record(q, ok, ch) {
  const first = !S.q[q.id];
  S.q[q.id] = { ok, ch, t: Date.now() }; save(); renderSide();
  if (ok) toast(first ? '✔ Acertou! +10 XP' : '✔ Acertou!');
}
function qCard(q, fresh) {
  const c = html(`<div class="q" id="q-${q.id}"></div>`);
  build(c, q, fresh ? null : S.q[q.id]);
  return c;
}
function build(c, q, st) {
  const t = q.t || 'mc', tag = { mc: 'múltipla escolha', curve: 'leia a curva', code: 'complete o código', bug: 'caça ao erro' }[t];
  c.innerHTML = `<div class="qh"><span class="qt">${tag}</span><span>Aulão ${q.aula.slice(1)}</span>${st ? (st.ok ? '<span class="okb">✔ acertou</span>' : '<span class="badb">✕ errou</span>') : ''}</div><p class="qq">${q.q}</p><div class="qb"></div><div class="qf"></div>`;
  const B = $('.qb', c), F = $('.qf', c);
  const showExp = ok => { const e = html(`<div class="exp ${ok ? 'ok' : 'bad'}"><b>${ok ? 'Isso mesmo!' : 'Não foi dessa vez.'}</b> ${q.e}</div>`); B.after(e); F.innerHTML = '<button class="btn" data-redo>↺ Refazer</button>'; $('[data-redo]', F).onclick = () => build(c, q, null); };
  if (t === 'mc' || t === 'curve') {
    if (t === 'curve') { const cv = html('<canvas class="ch" style="height:190px;margin-bottom:6px"></canvas>'); B.append(cv); B.append(html(LEG)); requestAnimationFrame(() => curveChart(cv, curves(PR[q.cv]))); }
    const ord = shuffle(q.o.map((_, i) => i), hash(q.id));
    const box = html('<div class="opts"></div>'); B.append(box);
    ord.forEach((i, k) => box.append(html(`<button class="opt" data-i="${i}"><span class="k">${LETTERS[k]}</span><span>${q.o[i]}</span></button>`)));
    const mark = ch => { $$('.opt', box).forEach(b => { b.disabled = true; const i = +b.dataset.i; if (i === q.a) b.classList.add('right'); else if (i === ch) b.classList.add('wrong'); }); };
    if (st) { mark(st.ch); showExp(st.ok); return; }
    box.onclick = e => { const b = e.target.closest('.opt'); if (!b || b.disabled) return; const ch = +b.dataset.i, ok = ch === q.a; mark(ch); record(q, ok, ch); showExp(ok); };
  }
  if (t === 'code') {
    const codeHtml = q.code.replace(/\[\[(\d)\]\]/g, (_, n) => { const opts = shuffle(q.b[n].map((_, i) => i), hash(q.id + n)); return `<select class="bl" data-b="${n}"><option value="">______</option>${opts.map(i => `<option value="${i}">${q.b[n][i].replace(/</g, '&lt;')}</option>`).join('')}</select>`; });
    B.append(html(`<pre class="code">${codeHtml}</pre>`));
    const sels = $$('select', B);
    const mark = ch => sels.forEach((s, i) => { s.value = ch[i]; s.disabled = true; s.classList.add(+ch[i] === 0 ? 'right' : 'wrong'); });
    if (st) { mark(st.ch); showExp(st.ok); return; }
    F.innerHTML = '<button class="btn pri" data-chk>Conferir</button><span class="muted" style="align-self:center;font-size:13px">preencha todos os espaços amarelos</span>';
    $('[data-chk]', F).onclick = () => { const ch = sels.map(s => s.value); if (ch.some(v => v === '')) return toast('Preencha todas as lacunas'); const ok = ch.every(v => +v === 0); mark(ch); record(q, ok, ch); showExp(ok); };
  }
  if (t === 'bug') {
    const box = html(`<div class="lines">${q.lines.map((l, i) => `<div class="ln" data-i="${i}">${l.replace(/</g, '&lt;')}</div>`).join('')}</div>`); B.append(box);
    const mark = ch => { $$('.ln', box).forEach(d => { const i = +d.dataset.i; if (i === q.a) d.classList.add('right'); else if (i === ch) d.classList.add('wrong'); d.style.pointerEvents = 'none'; }); };
    if (st) { mark(st.ch); showExp(st.ok); return; }
    box.onclick = e => { const d = e.target.closest('.ln'); if (!d) return; const ch = +d.dataset.i, ok = ch === q.a; mark(ch); record(q, ok, ch); showExp(ok); };
  }
}

/* ================= PÁGINAS ================= */
/* trilha de cada aulão: ideias → labs → questões → resumo */
const steps = a => [
  { id: 'ideias', t: 'Ideias-chave', kind: 'ideias' },
  ...a.labs.map(([k, t], i) => ({ id: 'lab-' + k, t, kind: 'lab', k, n: i + 1 })),
  ...a.quiz.map((q, i) => ({ id: q.id, t: 'Questão ' + (i + 1), kind: 'q', q, n: i + 1 })),
  { id: 'fim', t: 'Resumo final', kind: 'fim' }];
const isDone = (a, s) => s.kind === 'q' ? !!S.q[s.q.id] : !!S.done[a.id + ':' + s.id];
const stats = a => {
  const st = steps(a).filter(s => s.kind !== 'fim'), qd = a.quiz.filter(q => S.q[q.id]);
  const done = st.filter(s => isDone(a, s)).length;
  return { prog: Math.round(done / st.length * 100), done, total: st.length, qdone: qd.length, ok: qd.filter(q => S.q[q.id].ok).length, nq: a.quiz.length };
};
const xp = () => Object.values(S.q).filter(v => v.ok).length * 10 + Object.keys(S.done).length * 5 + Object.values(S.cards).filter(v => v === 'sei').length * 2;

function renderSide() {
  const wrong = Object.values(S.q).filter(v => !v.ok).length, cur = S.last;
  $('#side').innerHTML = `<div class="brand">OIAA 2026 · Fase 2<small>⭐ ${xp()} XP</small></div>
  ${fb ? (fb.user ? `<div class="sync on"><span>☁️ Sincronizando</span><small>${fb.user.email || ''}</small><button class="linkbtn" data-sair>Sair</button></div>` : `<button class="sync" data-entrar>☁️ <b>Entrar com Google</b><small>para salvar no PC e no celular</small></button>`) : ''}
  <button class="nav ${cur === 'home' ? 'on' : ''}" data-go="home" style="--c:var(--acc)"><span class="dot"></span><span class="lbl">Início</span></button>
  ${AULAS.map(a => { const s = stats(a); return `<button class="nav ${cur === a.id ? 'on' : ''}" data-go="${a.id}" style="--c:${a.c}"><span class="dot"></span><span class="lbl">Aulão ${a.n}<small>${a.t}</small><div class="mini"><i style="width:${s.prog}%"></i></div></span><span class="pc">${s.prog}%</span></button>`; }).join('')}
  <div class="sep"></div>
  <button class="nav ${cur === 'flash' ? 'on' : ''}" data-go="flash" style="--c:var(--acc2)"><span class="dot"></span><span class="lbl">Flashcards</span></button>
  <button class="nav ${cur === 'glos' ? 'on' : ''}" data-go="glos" style="--c:var(--a1)"><span class="dot"></span><span class="lbl">Glossário</span></button>
  <button class="nav ${cur === 'sim' ? 'on' : ''}" data-go="sim" style="--c:var(--warn)"><span class="dot"></span><span class="lbl">Simulado</span></button>
  <button class="nav ${cur === 'erros' ? 'on' : ''}" data-go="erros" style="--c:var(--bad)"><span class="dot"></span><span class="lbl">Revisar erros</span>${wrong ? `<span class="badge">${wrong}</span>` : ''}</button>`;
}
const navOn = () => { if (innerWidth < 900) { const o = $('#side .nav.on'); o && o.scrollIntoView({ inline: 'center', block: 'nearest' }); } };
$('#side').addEventListener('click', e => { if (e.target.closest('[data-entrar]')) return fb.entrar(); if (e.target.closest('[data-sair]')) return fb.sair(); const b = e.target.closest('[data-go]'); if (b) location.hash = b.dataset.go; });

function pageHome(M) {
  const last = AULAS.find(a => a.id === S.prev);
  const ls = last && stats(last);
  M.innerHTML = `<div class="kicker">OIAA 2026 · Fase 2</div><h1>Estude praticando</h1><p class="sub">Um assunto por vez: ideia, laboratório, questão. Seu progresso fica salvo neste navegador.</p>
  ${last ? `<div class="card cont" data-go="${last.id}" style="--c:${last.c}"><div class="ring" style="--p:${ls.prog}"><span>${ls.prog}%</span></div><div style="flex:1"><div class="kicker">Continuar</div><h3>Aulão ${last.n} · ${last.t}</h3><p class="muted" style="margin:2px 0 0">Passo ${(S.pos[last.id] || 0) + 1} de ${steps(last).length} · ${steps(last)[S.pos[last.id] || 0].t}</p></div><span class="btn pri">Continuar ›</span></div>` : ''}
  <h2>Aulões</h2><div class="grid">${AULAS.map(a => { const s = stats(a); return `<div class="card acard" data-go="${a.id}" style="--c:${a.c}"><div class="ring" style="--p:${s.prog}"><span>${s.prog}%</span></div><div><div class="kicker">Aulão ${a.n}</div><h3>${a.t}</h3><p>${s.prog === 100 ? '✔ concluído' : s.done ? `${s.done} de ${s.total} passos` : 'não iniciado'}</p></div></div>`; }).join('')}</div>
  <h2>Treino rápido</h2><div class="quick">
  <button class="card" data-go="sim">🎯 <b>Simulado</b><span>10 questões novas a cada vez</span></button>
  <button class="card" data-go="erros">🔁 <b>Revisar erros</b><span>${ALLQ.filter(q => S.q[q.id] && !S.q[q.id].ok).length} para refazer</span></button>
  <button class="card" data-go="flash">🃏 <b>Flashcards</b><span>${FC.length + GLOS.length} cartões, sem repetir</span></button></div>
  <p style="margin-top:40px"><button class="linkbtn" data-reset>Apagar todo o progresso</button></p>`;
  confirmBtn($('[data-reset]', M), 'Toque de novo para apagar tudo', () => { S = { q: {}, done: {}, pos: {}, cards: {}, last: 'home', scroll: {} }; save(); render(); });
}

function pageAula(M, a) {
  S.prev = a.id; save();
  const ST = steps(a), nl = a.labs.length, nq = a.quiz.length;
  M.style.setProperty('--c', a.c);
  M.innerHTML = `<div class="ahead"><div><div class="kicker">Aulão ${a.n}</div><h1>${a.t}</h1></div><button class="btn ghost" data-toc>☰ Sumário</button></div>
  <div class="prog"><div class="bar"><i data-o="pb"></i></div><b data-o="pc"></b></div>
  <div class="toc" hidden data-o="toc"></div>
  <div class="stage" data-o="st"></div>
  <div class="stepnav"><button class="btn" data-prev>‹ Anterior</button><span class="muted" data-o="ps"></span><button class="btn pri" data-next>Próximo ›</button></div>`;
  let i = clamp(S.pos[a.id] || 0, 0, ST.length - 1);
  const stage = $('[data-o=st]', M), toc = $('[data-o=toc]', M);
  const ui = () => {
    const s = stats(a), cur = ST[i];
    $('[data-o=pb]', M).style.width = s.prog + '%'; $('[data-o=pc]', M).textContent = s.prog + '%';
    $('[data-o=ps]', M).textContent = `${i + 1} / ${ST.length}`;
    $('[data-prev]', M).style.visibility = i ? 'visible' : 'hidden';
    const nx = $('[data-next]', M);
    nx.textContent = cur.kind === 'fim' ? (a.n < 4 ? `Ir para o Aulão ${a.n + 1} ›` : 'Fazer um simulado ›') : cur.kind === 'q' && !S.q[cur.q.id] ? 'Pular ›' : 'Próximo ›';
    nx.classList.toggle('pri', !(cur.kind === 'q' && !S.q[cur.q.id]));
    const grp = (title, list) => `<div class="tg">${title}</div>` + list.map(s => { const k = ST.indexOf(s); return `<button data-i="${k}" class="${k === i ? 'cur' : ''}"><span class="${isDone(a, s) ? 'ok' : ''}">${isDone(a, s) ? '✔' : '○'}</span>${s.t}</button>`; }).join('');
    const qs = ST.filter(s => s.kind === 'q').map(s => { const k = ST.indexOf(s), r = S.q[s.q.id]; return `<button data-i="${k}" class="qc ${k === i ? 'cur' : ''} ${r ? (r.ok ? 'ok' : 'bad') : ''}">${s.n}</button>`; }).join('');
    toc.innerHTML = grp('Começo', ST.filter(s => s.kind === 'ideias')) + grp(`Laboratórios (${nl})`, ST.filter(s => s.kind === 'lab')) + `<div class="tg">Questões (${nq}) · verde = certa, vermelho = errada</div><div class="qs">${qs}</div>` + grp('Fim', ST.filter(s => s.kind === 'fim'));
    renderSide();
  };
  const show = k => {
    i = clamp(k, 0, ST.length - 1); S.pos[a.id] = i; save(); redraws = [];
    const s = ST[i]; stage.innerHTML = '';
    if (s.kind === 'ideias') {
      stage.innerHTML = `<div class="kicker">Começo</div><h2 class="st">💡 Ideias-chave</h2><p class="sub">${a.s}. Leia com calma — os laboratórios a seguir mostram cada ideia funcionando.</p><div class="ideias">${a.ideias.map(([t, d], k) => `<div class="card idea"><b>${t}</b>${explain(d, SIMPLES[a.id][k])}</div>`).join('')}</div>`;
    } else if (s.kind === 'lab') {
      const card = html(`<div><div class="kicker">Laboratório ${s.n} de ${nl}</div><h2 class="st">${s.t}</h2><div class="labwrap">${explain(...LABTXT[s.k])}<div style="min-width:0"><div class="kicker" style="margin:0 0 8px">Mexa e veja</div><div class="card lab"><div class="body"></div></div></div></div></div>`);
      stage.append(card); LABS[s.k]($('.body', card));
    } else if (s.kind === 'q') {
      stage.append(html(`<div><div class="kicker">Questão ${s.n} de ${nq}</div></div>`));
      stage.append(qCard(s.q));
    } else {
      const st = stats(a);
      stage.innerHTML = `<div class="kicker">Fim do aulão</div><h2 class="st">Resumo</h2>
      <div class="card fim"><div class="ring big" style="--p:${st.prog}"><span>${st.prog}%</span></div><div><h3>${st.prog === 100 ? 'Aulão concluído! 🎉' : 'Quase lá'}</h3><p class="muted">${st.ok} de ${nq} questões certas · ${st.qdone < nq ? `${nq - st.qdone} questão(ões) puladas` : 'todas respondidas'}${st.prog < 100 ? ' · abra o Sumário para ver o que falta' : ''}</p></div></div>
      <div class="card" style="margin-top:14px"><div class="kicker">O que levar daqui</div><ul class="take">${a.levar.map(l => `<li>${l}</li>`).join('')}</ul></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn" data-go="erros">🔁 Revisar erros</button><button class="linkbtn" data-restart>Recomeçar este aulão do zero</button></div>`;
      confirmBtn($('[data-restart]', stage), 'Toque de novo para confirmar', () => { a.quiz.forEach(q => delete S.q[q.id]); ST.forEach(x => delete S.done[a.id + ':' + x.id]); save(); show(0); });
    }
    ui(); window.scrollTo({ top: 0 });
  };
  const next = () => {
    const s = ST[i];
    if (s.kind === 'fim') { location.hash = a.n < 4 ? 'a' + (a.n + 1) : 'sim'; return; }
    if (s.kind !== 'q' && !S.done[a.id + ':' + s.id]) { S.done[a.id + ':' + s.id] = 1; save(); }
    show(i + 1);
  };
  $('[data-next]', M).onclick = next;
  $('[data-prev]', M).onclick = () => show(i - 1);
  $('[data-toc]', M).onclick = () => toc.hidden = !toc.hidden;
  toc.onclick = e => { const b = e.target.closest('[data-i]'); if (b) { toc.hidden = true; show(+b.dataset.i); } };
  stage.addEventListener('click', () => setTimeout(ui, 0)); // atualiza % ao responder questão
  M.onkeydown = null;
  pageAula.key = e => { if (e.target.closest('input,select,textarea') || !$('[data-next]', M).isConnected) return; if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft' && i) show(i - 1); };
  show(i);
}
document.addEventListener('keydown', e => pageAula.key && pageAula.key(e));

/* simulado sem repetição: sorteia só questões ainda não vistas em simulados; ao esgotar as 100, novo ciclo */
function novoSimulado() {
  const seen = new Set(S.simSeen || []), r = Date.now() & 0xffff;
  let pick = shuffle(ALLQ.filter(q => !seen.has(q.id)), r).slice(0, 10);
  if (pick.length < 10) {
    S.simSeen = [];
    pick = pick.concat(shuffle(ALLQ.filter(q => !pick.includes(q)), r + 1).slice(0, 10 - pick.length));
    toast('Você já viu todas as questões! Começando um novo ciclo.');
  }
  S.simSeen = (S.simSeen || []).concat(pick.map(q => q.id));
  S.simCur = pick.map(q => q.id); S.simN = (S.simN || 0) + 1; save();
}
function pageSim(M) {
  if (!S.simCur || S.simCur.some(id => !QBY[id])) novoSimulado();
  const vistas = (S.simSeen || []).length;
  quizList(M, `🎯 Simulado nº ${S.simN}`, `10 questões que você ainda não tinha visto em simulados · ${vistas} de ${ALLQ.length} já sorteadas neste ciclo.`, S.simCur.map(id => QBY[id]), '🔀 Novo simulado (questões novas)', novoSimulado);
}

function quizList(M, title, sub, qs, again, onAgain) {
  M.innerHTML = `<h1>${title}</h1><p class="sub">${sub}</p><div class="qbar"><b data-o="sc"></b><span style="flex:1"></span>${again ? `<button class="btn pri" data-again>${again}</button>` : ''}</div><div data-o="l"></div>`;
  const L = $('[data-o=l]', M), t0 = Date.now();
  const up = () => { const d = qs.filter(q => S.q[q.id] && S.q[q.id].t >= t0), ok = d.filter(q => S.q[q.id].ok).length; $('[data-o=sc]', M).textContent = `${d.length}/${qs.length} respondidas · ${ok} certas${d.length === qs.length && qs.length ? ` · nota ${fmt(ok / qs.length * 10, 1)}` : ''}`; };
  qs.forEach(q => L.append(qCard(q, true)));
  if (!qs.length) L.innerHTML = `<div class="card">${callout('ok', 'Nada por aqui', 'Você não tem questões erradas pendentes. Bora fazer um simulado?')}</div>`;
  L.addEventListener('click', () => setTimeout(up, 0)); up();
  const ag = $('[data-again]', M); if (ag) ag.onclick = () => { S.scroll[S.last] = 0; if (onAgain) onAgain(); render(); };
}

/* baralho: cada cartão aparece uma vez por ciclo; os 28 do conteúdo + os termos do glossário */
const ALLFC = () => [...FC.map(c => ({ a: c[0], f: c[1], b: c[2] })), ...GLOS.map(g => ({ a: 'glos', f: `O que é: ${g[0]}?`, b: g[2], t: g[1] }))];
function pageFlash(M) {
  const D = ALLFC(), FL = [['all', 'Todos'], ['a1', 'Aulão 1'], ['a2', 'Aulão 2'], ['a3', 'Aulão 3'], ['a4', 'Aulão 4'], ['glos', 'Glossário'], ['nao', 'Não sei']];
  let f = S.fcFilter || 'all', hist = [];
  S.fcSeen = S.fcSeen || [];
  M.innerHTML = `<div class="kicker">Memorização ativa</div><h1>Flashcards</h1><p class="sub">Tente lembrar antes de virar. Cada cartão aparece uma vez só, até você passar pelo baralho inteiro.</p>
  <div data-o="f"></div><div data-o="c"></div>`;
  const inFilter = k => f === 'all' || (f === 'nao' ? S.cards[k] === 'nao' : D[k].a === f);
  const keys = () => D.map((_, k) => k).filter(inFilter);
  const unseen = () => keys().filter(k => !S.fcSeen.includes(k));
  const pick = () => { const u = unseen(); S.fcCur = u.length ? u[Math.floor(Math.random() * u.length)] : null; save(); };
  const draw = () => {
    const K = keys(), vistos = K.length - unseen().length, known = Object.values(S.cards).filter(v => v === 'sei').length;
    $('[data-o=f]', M).innerHTML = `<div class="seg">${FL.map(([k, t]) => `<button data-f="${k}" class="${f === k ? 'on' : ''}">${t}</button>`).join('')}</div>
    <div class="prog" style="margin:4px 0 6px"><div class="bar"><i style="width:${K.length ? vistos / K.length * 100 : 0}%;background:var(--acc2)"></i></div><b>${vistos}/${K.length}</b></div>
    <div class="muted" style="font-size:13px">${vistos} de ${K.length} cartões vistos neste ciclo · ${known} marcados como "sei"</div>`;
    const C = $('[data-o=c]', M);
    if (!K.length) { C.innerHTML = callout('ok', 'Nada neste filtro', f === 'nao' ? 'Você não marcou nenhum cartão como "não sabia".' : 'Escolha outro filtro.'); return; }
    if (S.fcCur == null || !inFilter(S.fcCur) || S.fcSeen.includes(S.fcCur)) pick();
    if (S.fcCur == null) {
      C.innerHTML = `<div class="card fim" style="margin-top:14px"><div class="ring big" style="--p:100"><span>✔</span></div><div><h3>Você passou pelos ${K.length} cartões!</h3><p class="muted">Nenhum se repetiu. Comece um novo ciclo para rever todos em outra ordem${f !== 'nao' ? ', ou use o filtro "Não sei" para treinar só os que errou' : ''}.</p><button class="btn pri" data-ciclo>🔀 Começar novo ciclo</button></div></div>`;
      return;
    }
    const c = D[S.fcCur], st = S.cards[S.fcCur];
    C.innerHTML = `<div class="flip" style="max-width:720px;margin:14px 0;min-height:240px"><div class="in" style="min-height:240px"><div class="f"><small>${c.a === 'glos' ? 'Glossário' : 'Aulão ' + c.a.slice(1)} · cartão novo ${st ? (st === 'sei' ? '· <span class="okb">já marcou: sei</span>' : '· <span class="badb">já marcou: não sei</span>') : ''}</small><h2 style="margin:10px 0">${c.f}</h2><small>toque para virar ↻</small></div><div class="b" style="overflow:auto"><small>resposta</small><h2 style="margin:8px 0;font-size:18px">${c.b}</h2>${c.t ? `<small>Técnico: ${c.t}</small>` : ''}</div></div></div>
    <div class="fcbar"><button class="btn" data-back ${hist.length ? '' : 'disabled'}>‹ voltar</button><button class="btn" data-m="nao" style="border-color:var(--bad)">✕ Não sabia</button><button class="btn pri" data-m="sei">✔ Sabia</button><button class="btn" data-skip>pular ›</button></div>`;
    $('.flip', M).onclick = e => e.currentTarget.classList.toggle('on');
  };
  const advance = () => { S.fcSeen.push(S.fcCur); hist.push(S.fcCur); pick(); draw(); };
  M.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.f) { f = S.fcFilter = t.dataset.f; save(); draw(); }
    else if (t.dataset.m) { const was = S.cards[S.fcCur]; S.cards[S.fcCur] = t.dataset.m; renderSide(); if (t.dataset.m === 'sei' && was !== 'sei') toast('+2 XP'); advance(); }
    else if ('skip' in t.dataset) advance();
    else if ('back' in t.dataset && hist.length) { const k = hist.pop(); S.fcSeen = S.fcSeen.filter(x => x !== k); S.fcCur = k; save(); draw(); }
    else if ('ciclo' in t.dataset) { const K = keys(); S.fcSeen = S.fcSeen.filter(k => !K.includes(k)); hist = []; pick(); draw(); }
  });
  draw();
}

/* ================= roteador ================= */
function render() {
  const p = (location.hash.slice(1) || S.last || 'home');
  const page = ['home', 'flash', 'glos', 'sim', 'erros', ...AULAS.map(a => a.id)].includes(p) ? p : 'home';
  S.last = page; save(); redraws = [];
  const old = $('#main'), M = old.cloneNode(false); old.replaceWith(M); // descarta listeners antigos
  M.style.removeProperty('--c');
  if (page === 'home') pageHome(M);
  else if (page === 'flash') pageFlash(M);
  else if (page === 'glos') pageGlos(M);
  else if (page === 'sim') pageSim(M);
  else if (page === 'erros') quizList(M, '🔁 Revisar erros', 'Questões que você errou. Acerte para elas saírem da lista (na próxima vez que abrir esta página).', ALLQ.filter(q => S.q[q.id] && !S.q[q.id].ok));
  else pageAula(M, AULAS.find(a => a.id === page));
  M.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) location.hash = g.dataset.go; });
  renderSide(); navOn();
  if (!AULAS.some(a => a.id === page)) requestAnimationFrame(() => window.scrollTo(0, S.scroll[page] || 0));
}
let scT; window.addEventListener('scroll', () => { clearTimeout(scT); scT = setTimeout(() => { S.scroll[S.last] = Math.round(scrollY); save(false); }, 300); });
window.addEventListener('hashchange', () => { S.scroll[S.last] = Math.round(scrollY); render(); });
if (!location.hash && S.last && S.last !== 'home') history.replaceState(null, '', '#' + S.last);
render();

/* progresso na nuvem: no link publicado, cada pessoa tem um documento privado
   (data/users/<id>/progresso) que junta o que foi feito no PC e no celular */
function mesclar(R) {
  for (const [id, v] of Object.entries(R.q || {})) if (!S.q[id] || (v.t || 0) > (S.q[id].t || 0)) S.q[id] = v;
  S.done = Object.assign({}, R.done, S.done);
  for (const [k, v] of Object.entries(R.cards || {})) if (!(k in S.cards)) S.cards[k] = v;
  for (const [k, v] of Object.entries(R.pos || {})) S.pos[k] = Math.max(S.pos[k] || 0, v);
  if (!S.prev && R.prev) S.prev = R.prev;
  for (const k of ['simSeen', 'fcSeen']) S[k] = [...new Set([...(S[k] || []), ...(R[k] || [])])];
}
/* liga um banco qualquer: lê uma vez, mescla, e depois grava (com pausa de 1,5 s) a cada mudança */
async function ligarNuvem(ler, gravar) {
  let writing = false, dirty = false, t;
  const flush = async () => {
    if (writing || !dirty) return; writing = true; dirty = false;
    try { await gravar(JSON.stringify(S)); } catch (e) { console.warn('sync', e); }
    writing = false; if (dirty) flush();
  };
  const remoto = await ler();
  if (remoto) { const antes = JSON.stringify(S); mesclar(JSON.parse(remoto)); if (JSON.stringify(S) !== antes) { save(false); render(); toast('☁️ Progresso sincronizado'); } }
  pushRemote = () => { dirty = true; clearTimeout(t); t = setTimeout(flush, 1500); };
  pushRemote();
}

/* 1) link do Claude: banco privado por pessoa (data/users/<id>/progresso) */
async function syncClaude() {
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (!db || !user) return;
  const uid = await user.id(); if (!uid) return;
  const ref = db.doc('data/users/' + uid + '/progresso');
  try { await ligarNuvem(async () => { const s = await ref.get(); return s.exists ? s.data().s : null; }, s => ref.set({ s, t: Date.now() })); } catch (e) { }
}

/* 2) GitHub Pages: Firebase (login Google + Firestore, documento progresso/<uid>).
   Preencha com a configuração do app web do seu projeto Firebase. */
const FIREBASE_CONFIG = null;
const FB_VER = '10.12.2';
const carregar = src => new Promise((ok, erro) => { const e = document.createElement('script'); e.src = src; e.onload = ok; e.onerror = erro; document.head.append(e); });
async function syncFirebase() {
  if (!FIREBASE_CONFIG) return;
  try { for (const m of ['app', 'auth', 'firestore']) await carregar(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`); }
  catch (e) { return; } // sem internet: segue só com o progresso local
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(), store = firebase.firestore();
  fb = {
    user: null,
    entrar: async () => {
      const p = new firebase.auth.GoogleAuthProvider();
      try { await auth.signInWithPopup(p); }
      catch (e) { if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') await auth.signInWithRedirect(p); else if (e.code !== 'auth/popup-closed-by-user') toast('Não foi possível entrar: ' + e.code); }
    },
    sair: async () => { await auth.signOut(); toast('Você saiu. O progresso continua salvo neste aparelho.'); }
  };
  auth.onAuthStateChanged(async u => {
    fb.user = u; pushRemote = null; renderSide();
    if (!u) return;
    const ref = store.collection('progresso').doc(u.uid);
    try { await ligarNuvem(async () => { const s = await ref.get(); return s.exists ? s.data().s : null; }, s => ref.set({ s, t: Date.now() })); }
    catch (e) { toast('Erro ao sincronizar: ' + (e.code || e.message)); }
  });
  renderSide();
}

if (window.claude && window.claude.use) syncClaude(); else syncFirebase();
