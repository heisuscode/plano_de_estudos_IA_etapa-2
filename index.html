<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudo OIAA 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#0c0f15; --panel:#141924; --panel2:#1a2030; --line:#262e40; --text:#dce3ee; --mute:#8b96aa;
  --acc:#5eead4; --acc2:#a78bfa; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --pos:#5eead4; --neg:#fb923c;
  --a1:#60a5fa; --a2:#34d399; --a3:#f472b6; --a4:#fbbf24; --c:var(--acc);
  --r:14px;
}
*{box-sizing:border-box}
:root{color-scheme:dark}
html{color-scheme:dark}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0f131c}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
a{color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
code,pre,.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:#0f131c;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:800;letter-spacing:.3px;font-size:17px;margin:0 6px 2px}
.brand small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.xp{margin:8px 6px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--mute)}
.xp b{color:var(--warn);font-size:16px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid transparent;background:none;text-align:left;width:100%;color:var(--text)}
.nav:hover{background:var(--panel)}
.nav.on{background:var(--panel2);border-color:var(--line)}
.nav .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.nav .lbl{flex:1;min-width:0}
.nav .lbl small{display:block;color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .mini{height:4px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
.nav .mini i{display:block;height:100%;background:var(--c);width:0}
.sep{height:1px;background:var(--line);margin:8px 4px}
.badge{font-size:11px;background:var(--bad);color:#200;border-radius:20px;padding:0 7px;font-weight:700}
/* main */
main{padding-block:32px 0;padding-left:max(16px,env(safe-area-inset-left,0px),4vw);padding-right:max(16px,env(safe-area-inset-right,0px),4vw);width:100%;min-width:0;display:flex;flex-direction:column;min-height:100vh}
main>*{flex-shrink:0}
.explain{display:grid;gap:8px;margin:10px 0 4px}
.explain>div{border-radius:11px;padding:11px 14px;border:1px solid var(--line)}
.explain span{display:block;font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;margin-bottom:3px}
.explain p{margin:0;font-size:14.5px;line-height:1.6}
.explain .tec{background:var(--bg)}.explain .tec span{color:var(--acc2)}
.explain .simple{background:#11241a;border-color:#245236}.explain .simple span{color:var(--ok)}
.ideias{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))}
.ideias .idea{border-left:3px solid var(--c)}
.ideias .idea .explain{margin-bottom:0}
.busca{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;color:var(--text);font:inherit;font-size:16px;margin-bottom:12px}
.busca:focus,.btn:focus-visible,.opt:focus-visible,.nav:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.glist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))}
.gl{margin:0}
.labwrap{display:grid;gap:14px}
.labwrap .explain{margin:0}
@media (min-width:1200px){.labwrap{grid-template-columns:minmax(280px,360px) minmax(0,1fr);align-items:start}.labwrap .explain{position:sticky;top:20px}.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1700px){.labwrap{grid-template-columns:420px minmax(0,1fr)}}.gl h3{margin-bottom:2px}
button,a,input,select,.node,td.c,.hb,.flip,.ln{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* trilha */
.ahead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ahead h1{font-size:24px}
.btn.ghost{background:none}
.prog{display:flex;align-items:center;gap:12px;margin:14px 0 26px}
.prog .bar{flex:1;height:8px;margin:0}
.prog b{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
h2.st{margin:4px 0 14px;font-size:22px}
.stage{flex:1 0 auto}
.stage .lab .body{padding:18px}
.stepnav{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0 calc(18px + env(safe-area-inset-bottom,0px));margin-top:22px;background:linear-gradient(to bottom,transparent,var(--bg) 35%);z-index:3}
.stepnav .btn{min-width:130px;padding:11px 16px;font-size:15px}
.toc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;margin:-10px 0 22px}
.toc .tg{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);padding:8px 10px 4px}
.toc button{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--mute);font-size:13.5px}
.toc .qs{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 6px}
.toc .qs .qc{width:36px;justify-content:center;padding:6px 0;border:1px solid var(--line)}
.toc .qs .qc.ok{color:var(--ok);border-color:#265c3c}.toc .qs .qc.bad{color:var(--bad);border-color:#6b2a2a}
.toc .qs .qc.cur{outline:2px solid var(--c)}
.toc button:hover{color:var(--text)}
.toc button.cur{background:var(--panel2);color:var(--text)}
.toc .ok{color:var(--ok)}
.sync{display:flex;flex-direction:column;gap:1px;text-align:left;margin:4px 0 8px;padding:9px 11px;border-radius:10px;border:1px solid var(--acc);background:#10221f;color:var(--text);font-size:13px}
.sync small{color:var(--mute);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.sync.on{border-color:#245236;background:#11241a}.sync.on span{color:var(--ok);font-weight:700}
.sync .linkbtn{align-self:flex-start;margin-top:2px}
.nav .pc{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.cont{display:flex;align-items:center;gap:16px;cursor:pointer;border-color:var(--c);flex-wrap:wrap}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.quick .card{text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--text)}
.quick .card:hover{border-color:var(--acc)}
.quick span{color:var(--mute);font-size:13px}
.linkbtn{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:13px;padding:0}
.linkbtn:hover{color:var(--bad)}
.fim{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.fcbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:720px}
@media (max-width:600px){.fcbar{grid-template-columns:1fr 1fr}}
.ring.big{width:96px;height:96px}.ring.big span{width:78px;height:78px;font-size:20px}
h1{font-size:clamp(24px,3vw,32px);margin:0 0 4px;line-height:1.2}
h2{font-size:20px;margin:36px 0 12px}
h3{font-size:17px;margin:0}
.sub{color:var(--mute);margin:0 0 18px}
.kicker{color:var(--c);font-weight:700;font-size:12px;letter-spacing:1.2px;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 11px;font-size:13px;color:var(--mute)}
.chip:hover{color:var(--text);border-color:var(--c)}
.chip.done{color:var(--ok);border-color:#24553a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.idea{border-left:3px solid var(--c)}
.idea b{display:block;margin-bottom:4px}
.idea p{margin:0;color:var(--mute);font-size:14px}
.lab{margin:18px 0;padding:0;overflow:hidden}
.lab>header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.lab>header .tag{font-size:11px;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:6px;padding:1px 6px;letter-spacing:.5px}
.lab>header h3{flex:1}
.lab>header .chk{font-size:12px;color:var(--mute)}
.lab>header .chk.on{color:var(--ok)}
.lab .body{padding:16px}
.lead{margin:0 0 12px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.row>*{flex:1 1 260px;min-width:0}
.ctl{display:block;margin:6px 0 12px;font-size:13.5px;color:var(--mute)}
.ctl span{display:flex;justify-content:space-between;gap:8px}
.ctl b{color:var(--text)}
input[type=range]{width:100%;accent-color:var(--c)}
input[type=checkbox]{accent-color:var(--c);width:16px;height:16px;vertical-align:middle}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin:4px 0 10px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;color:var(--mute);font-size:13.5px}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--c)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:14px}
.btn:hover{border-color:var(--c)}
.btn.pri{background:var(--c);color:#06201b;border-color:transparent;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.stat small{display:block;color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.callout{border-radius:11px;padding:11px 14px;margin-top:10px;background:var(--panel2);border:1px solid var(--line);font-size:14.5px}
.callout b{display:block;font-size:12px;letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px}
.callout.ok{border-color:#265c3c;background:#11241a}.callout.ok b{color:var(--ok)}
.callout.bad{border-color:#6b2a2a;background:#2a1414}.callout.bad b{color:var(--bad)}
.callout.warn{border-color:#6b5520;background:#2a2210}.callout.warn b{color:var(--warn)}
canvas.ch{width:100%;height:230px;display:block;background:var(--bg);border:1px solid var(--line);border-radius:11px}
.legend{font-size:12.5px;color:var(--mute);margin:6px 2px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin:0 5px 0 10px}
pre.code{background:#0a0d13;border:1px solid var(--line);border-radius:11px;padding:12px 14px;overflow:auto;font-size:13px;line-height:1.7;margin:8px 0;white-space:pre}
.cm{color:#6b7891}
.hl{background:#1d2b3f;outline:1px solid #335;border-radius:4px}
.svgbox{background:var(--bg);border:1px solid var(--line);border-radius:11px;width:100%;display:block}
.node{cursor:pointer}
.tbl{border-collapse:separate;border-spacing:3px;font-variant-numeric:tabular-nums;font-size:13px}
.tbl td,.tbl th{padding:6px 8px;text-align:center;border-radius:6px}
.tbl th{color:var(--mute);font-weight:600;font-size:12px}
.tbl td.c{cursor:pointer;min-width:46px}
.tbl td.c.sel{outline:2px solid var(--text)}
.hbars .hb{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:6px 0;font-size:13.5px;cursor:pointer}
.hbars .hb .bar{height:14px;margin:0}
.hbars .hb.sel span{color:var(--text);font-weight:700}
.hbars .hb span{color:var(--mute)}
.tok{display:inline-block;padding:2px 7px;margin:2px;border-radius:6px;background:#1e2a3d;border:1px solid #2c3d58;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.tok.sub{background:#2a1f3d;border-color:#4a3570}
.tok.drop{background:#3a1717;border-color:#7a2a2a;text-decoration:line-through;color:#f9a8a8}
.blocks{display:flex;flex-direction:column;gap:5px}
.blk{display:flex;justify-content:space-between;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.blk.frz{color:var(--mute)}
.blk.frz em{color:#7dd3fc}
.blk.tr{border-color:var(--ok);background:#11241a}
.blk.tr em{color:var(--ok)}
.blk em{font-style:normal;font-size:12px;font-weight:700;letter-spacing:.6px}
.flip{perspective:900px;cursor:pointer;min-height:140px}
.flip .in{position:relative;transition:transform .5s;transform-style:preserve-3d;min-height:140px}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:16px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;justify-content:center}
.flip .b{transform:rotateY(180deg);background:#162232;border-color:var(--c)}
.flip small{color:var(--mute)}
/* quiz */
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.qh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);margin-bottom:6px}
.qh .qt{border:1px solid var(--line);border-radius:6px;padding:0 6px}
.okb{color:var(--ok);font-weight:700}.badb{color:var(--bad);font-weight:700}
.qq{margin:0 0 10px;font-weight:600}
.opts{display:grid;gap:7px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;background:var(--panel2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute)}
.opt.right{border-color:var(--ok);background:#11241a}.opt.right .k{background:var(--ok);color:#062}
.opt.wrong{border-color:var(--bad);background:#2a1414}.opt.wrong .k{background:var(--bad);color:#400}
.opt:disabled{cursor:default}
.exp{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel2);font-size:14px;border-left:3px solid var(--acc)}
.exp.ok{border-color:var(--ok)}.exp.bad{border-color:var(--bad)}
.qf{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
select.bl{background:#2a2410;color:var(--warn);border:1px dashed var(--warn);border-radius:6px;font:inherit;font-size:13px;padding:1px 4px;font-family:ui-monospace,Consolas,monospace}
select.bl.right{background:#11241a;color:var(--ok);border:1px solid var(--ok)}
select.bl.wrong{background:#2a1414;color:var(--bad);border:1px solid var(--bad)}
.lines{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:#0a0d13;border:1px solid var(--line);border-radius:11px;padding:6px}
.ln{padding:6px 10px;border-radius:7px;cursor:pointer;white-space:pre-wrap;word-break:break-word}
.ln:hover{background:#151c29}
.ln.right{background:#11241a;outline:1px solid var(--ok)}
.ln.wrong{background:#2a1414;outline:1px solid var(--bad)}
.toast{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));top:calc(18px + env(safe-area-inset-top,0px));background:var(--panel2);border:1px solid var(--c);color:var(--text);padding:10px 14px;border-radius:11px;font-weight:600;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:800;font-size:15px}
.acard{display:flex;gap:14px;align-items:center;cursor:pointer;border-top:3px solid var(--c)}
.acard:hover{border-color:var(--c)}
.acard p{margin:2px 0 0;color:var(--mute);font-size:13px}
.take li{margin:6px 0}
.muted{color:var(--mute)}
.qbar{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;z-index:5;align-items:center}
  .brand,.xp small,.sep,.nav .lbl small,.nav .mini,.nav .pc{display:none}
  .sync{flex-direction:row;align-items:center;gap:8px;margin:0;white-space:nowrap;flex:none}
  .sync small{display:none}
  .stepnav .btn{min-width:0;flex:1}
  .side{top:env(safe-area-inset-top,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));scrollbar-width:none}
  main{padding-block:20px 0}
  h1{font-size:22px} h2.st{font-size:19px} .ahead h1{font-size:20px}
  .card,.q{padding:14px} .stage .lab .body{padding:14px}
  .seg button{padding:9px 12px;font-size:14px}
  select.bl{font-size:16px;padding:3px 4px}
  pre.code{font-size:12.5px;padding:10px}
  .opt{padding:12px}
  .tbl td,.tbl th{padding:6px 5px} .tbl td.c{min-width:40px}
  canvas.ch{height:210px}
  .row>*{flex-basis:100%}
  .explain p{font-size:14px}
  .toast{left:16px;right:16px;text-align:center;top:calc(64px + env(safe-area-inset-top,0px))}
  .xp{margin:0;white-space:nowrap;padding:6px 8px}
  .nav{width:auto;white-space:nowrap;padding:7px 10px}
  .qbar{top:52px}
  .hbars .hb{grid-template-columns:110px 1fr 42px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ================= utilidades ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const html = s => { const t = document.createElement('template'); t.innerHTML = s.trim(); return t.content.firstElementChild; };
const fmt = (n, d = 2) => Number(n).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (n, d = 1) => fmt(n, d) + '%';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const lerp = (pts, x) => { // interpolação linear em tabela [[x,y],...]
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) { const [a, b] = [pts[i - 1], pts[i]]; return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]); }
  return pts[pts.length - 1][1];
};
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = s => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261);
const shuffle = (arr, seed) => { const r = rng(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ================= progresso (localStorage) ================= */
const KEY = 'oiaa2026-estudo-v1';
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { }
S = Object.assign({ q: {}, done: {}, pos: {}, cards: {}, last: 'home', scroll: {} }, S);
let pushRemote = null; // ligado por ligarNuvem() quando há um banco disponível

const save = (remote = true) => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } if (remote && pushRemote) pushRemote(); };

/* gráfico de linhas em canvas */
let redraws = [];
function chart(cv, ser, o = {}) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 320, H = cv.clientHeight || 220;
  cv.width = W * dpr; cv.height = H * dpr;
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
  const L = 44, R = 14, T = 14, B = o.xlabel ? 34 : 18;
  const n = o.n ?? Math.max(...ser.map(s => s.d.length));
  const all = ser.flatMap(s => s.d).filter(v => v != null && isFinite(v));
  const y0 = o.ymin ?? 0, y1 = o.ymax ?? Math.max(...all, 0.01) * 1.1;
  const X = i => L + (n <= 1 ? 0 : i / (n - 1)) * (W - L - R);
  const Y = v => T + (1 - (clamp(v, y0, y1) - y0) / (y1 - y0)) * (H - T - B);
  c.font = '11px system-ui'; c.fillStyle = css('--mute'); c.strokeStyle = css('--line'); c.lineWidth = 1;
  for (let k = 0; k <= 4; k++) { const v = y0 + (y1 - y0) * k / 4, y = Y(v); c.beginPath(); c.moveTo(L, y); c.lineTo(W - R, y); c.stroke(); c.fillText(o.yfmt ? o.yfmt(v) : fmt(v, 2), 4, y + 4); }
  if (o.xlabel) { c.textAlign = 'center'; c.fillText(o.xlabel, (L + W - R) / 2, H - 8); c.textAlign = 'left'; }
  (o.h || []).forEach(h => { c.setLineDash([4, 4]); c.strokeStyle = h.c || css('--warn'); c.beginPath(); c.moveTo(L, Y(h.v)); c.lineTo(W - R, Y(h.v)); c.stroke(); c.setLineDash([]); c.fillStyle = h.c || css('--warn'); c.fillText(h.label || '', L + 6, Y(h.v) - 5); });
  (o.v || []).forEach(v => { c.setLineDash([3, 4]); c.strokeStyle = v.c || css('--mute'); c.beginPath(); c.moveTo(X(v.i), T); c.lineTo(X(v.i), H - B); c.stroke(); c.setLineDash([]); c.fillStyle = v.c || css('--mute'); if (v.label) c.fillText(v.label, Math.min(X(v.i) + 5, W - 90), T + 12); });
  ser.forEach(s => {
    c.strokeStyle = s.c; c.lineWidth = s.w || 2.2; c.setLineDash(s.dash ? [7, 5] : []); c.beginPath();
    let st = false; s.d.forEach((v, i) => { if (v == null) return; st ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)); st = true; }); c.stroke(); c.setLineDash([]);
    if (s.dots) s.d.forEach((v, i) => { if (v == null) return; c.fillStyle = s.c; c.beginPath(); c.arc(X(i), Y(v), 2.6, 0, 7); c.fill(); });
  });
  (o.dots || []).forEach(d => { c.fillStyle = d.c; c.beginPath(); c.arc(X(d.i), Y(d.v), 6, 0, 7); c.fill(); c.strokeStyle = '#0008'; c.stroke(); if (d.label) { c.fillText(d.label, Math.min(X(d.i) + 9, W - 110), Y(d.v) - 8); } });
  return { X, Y };
}
function reg(fn) { redraws.push(fn); requestAnimationFrame(fn); return fn; }
window.addEventListener('resize', () => redraws.forEach(f => f()));

/* gerador de curvas de perda sintéticas */
function curves(p) {
  const r = rng(p.seed || 7), n = p.n || 14, tr = [], va = [];
  for (let t = 0; t < n; t++) {
    let b = p.floor + (p.start - p.floor) * Math.exp(-p.k * t);
    if (p.warm) b += p.warm * Math.exp(-0.9 * t);
    const n1 = p.noise ? (r() - .5) * p.noise * 2 : 0, n2 = p.noise ? (r() - .5) * p.noise * 2.2 : 0;
    tr.push(Math.max(.02, b - (p.over || 0) * .2 * (t / n) + n1 + (p.rise || 0) * t));
    va.push(Math.max(.02, b + (p.gap ?? .05) + (p.over ? p.over * .045 * Math.pow(Math.max(0, t - p.turn), 1.25) : 0) + n2 + (p.rise || 0) * t * 1.2));
  }
  const best = va.indexOf(Math.min(...va));
  return { tr, va, best };
}
const PR = {
  saudavel: { n: 14, k: .32, floor: .33, start: 1.1, gap: .07, seed: 3 },
  sobre: { n: 14, k: .45, floor: .22, start: 1.1, gap: .05, over: 1, turn: 5, seed: 4 },
  sub: { n: 14, k: .2, floor: .8, start: 1.15, gap: .03, seed: 5 },
  alta: { n: 14, k: .5, floor: .62, start: 1.1, noise: .17, rise: .02, seed: 6 },
  baixa: { n: 14, k: .05, floor: .3, start: 1.1, gap: .05, seed: 7 },
  facil: { n: 14, k: .32, floor: .45, start: 1.1, gap: -.24, seed: 8 },
  aquec: { n: 12, k: .4, floor: .3, start: 1.0, warm: .7, gap: .06, seed: 9 },
  epoca: { n: 12, k: .7, floor: .2, start: 1.0, gap: .06, over: 1.2, turn: 5, seed: 10 },
};
function curveChart(cv, cu, o = {}) {
  return chart(cv, [{ d: cu.tr, c: css('--acc') }, { d: cu.va, c: css('--acc2'), dash: 1 }], Object.assign({ xlabel: 'épocas →', ymax: Math.max(1.25, ...cu.tr, ...cu.va) }, o));
}

/* desenho da "planta" usada nos labs de imagem */
function drawLeaf(c, s, bgAlt) {
  const g = c.createLinearGradient(0, 0, s, s);
  g.addColorStop(0, bgAlt ? '#5a4a8a' : '#6b5a3e'); g.addColorStop(1, bgAlt ? '#2c3e6b' : '#3b3123');
  c.fillStyle = g; c.fillRect(0, 0, s, s);
  c.save(); c.translate(s / 2, s / 2); c.rotate(-.5);
  c.fillStyle = '#3f9a4a'; c.beginPath(); c.ellipse(0, 0, s * .36, s * .2, 0, 0, 7); c.fill();
  c.strokeStyle = '#2b6b33'; c.lineWidth = s * .015; c.beginPath(); c.moveTo(-s * .36, 0); c.lineTo(s * .36, 0); c.stroke();
  for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * s * .1, 0); c.lineTo(i * s * .1 + s * .07, -s * .13); c.moveTo(i * s * .1, 0); c.lineTo(i * s * .1 + s * .07, s * .13); c.stroke(); }
  c.fillStyle = '#1a2414';
  [[-.14, -.06], [.05, .07], [.18, -.05]].forEach(([x, y]) => { c.beginPath(); c.arc(x * s, y * s, s * .028, 0, 7); c.fill(); });
  c.restore();
}

      g += `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${lit ? edgeCol : css('--line')}" stroke-width="${lit ? 1.6 : 1}" opacity="${lit ? .7 : .6}" ${f === 3 ? 'stroke-dasharray="5 4"' : ''}/>`;
    }
    for (let l = 0; l < 4; l++) for (let j = 0; j < s[l]; j++) {
      const [x, y] = pos(l, j); const lit = (f === 0 && l === 0) || (f === 1 && l <= 2) || (f === 2) || f >= 3;
      g += `<circle cx="${x}" cy="${y}" r="15" fill="${lit ? '#1d2c40' : '#141924'}" stroke="${lit ? edgeCol : css('--line')}" stroke-width="2"/>`;
    }
    if (f >= 2) g += `<text x="565" y="40" fill="${f === 4 ? css('--ok') : css('--bad')}" font-size="15" font-weight="700" text-anchor="end">erro ${f === 4 ? '0,41' : '0,68'}</text>`;
    if (f === 3) g += `<text x="300" y="210" fill="${css('--bad')}" font-size="12" text-anchor="middle">← o erro volta para trás</text>`;
    else if (f < 3) g += `<text x="300" y="210" fill="${css('--acc')}" font-size="12" text-anchor="middle">a informação vai para a frente →</text>`;
    svg.innerHTML = g;
    $('[data-o=msg]', el).innerHTML = callout(f === 4 ? 'ok' : f === 3 ? 'bad' : '', `Quadro ${f + 1} de 5 · ${FR[f][0]}`, FR[f][2]);
  };
  bindSeg(el, 'f', i => { f = i; clearInterval(timer); draw(); });
  el.addEventListener('click', e => {
    const a = e.target.dataset.a; if (!a) return; clearInterval(timer);
    if (a === 'next') f = Math.min(4, f + 1); if (a === 'reset') f = 0;
    if (a === 'play') { f = 0; timer = setInterval(() => { if (f >= 4) return clearInterval(timer); f++; draw(); }, 1300); }
    draw();
  });
  draw();
};

LABS.taxa = el => {
  el.innerHTML = `<p class="lead">Descer uma montanha no escuro: o gradiente diz para que lado o chão desce; a <b>taxa</b> é o tamanho do passo; as <b>épocas</b> são quantos passos cabem no tempo.</p>
  <div class="row"><div>${sl('lr', 'taxa de aprendizado', .01, 1.2, .01, .35)}${sl('ep', 'épocas disponíveis', 5, 50, 1, 20)}${sl('x0', 'onde começar', -3, 3, .1, -2.4)}
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-a="go">▶ Treinar</button><button class="btn" data-a="rs">↺ Reiniciar</button></div>
  <div class="muted" style="font-size:12px;margin-top:14px">ou teste um exemplo pronto:</div><div class="seg"><button data-p=".35,20">passo certo</button><button data-p="1.1,20">grande demais</button><button data-p=".03,20">pequeno demais</button></div></div>
  <div style="flex:1.5 1 300px"><canvas class="ch" style="height:260px"></canvas><div class="stats"><div class="stat"><small>erro no fim</small><b data-o="e">—</b></div><div class="stat"><small>época</small><b data-o="t">0</b></div></div></div></div>
  <div data-o="msg"></div>
  ${callout('warn', 'Guardem este número', 'Nos modelos desta fase a taxa vai de <b style="display:inline;font-size:inherit;text-transform:none;letter-spacing:0">0,00001 a 0,02</b>. São mil vezes de diferença: modelo grande e já treinado precisa de passo minúsculo para não estragar o que já sabia.')}`;
  const cv = $('canvas', el); let path = [], timer;
  const v = k => +$(`[data-k=${k}]`, el).value;
  const draw = () => {
    ['lr', 'ep', 'x0'].forEach(k => $(`[data-v=${k}]`, el).textContent = fmt(v(k), k === 'ep' ? 0 : 2));
    const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr;
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const X = x => W / 2 + x / 3.4 * (W / 2 - 14), Y = y => H - 18 - y / 11.5 * (H - 36);
    c.strokeStyle = css('--line'); c.beginPath(); c.moveTo(0, Y(0)); c.lineTo(W, Y(0)); c.stroke();
    c.strokeStyle = css('--mute'); c.lineWidth = 2; c.beginPath(); for (let x = -3.4; x <= 3.4; x += .05) { const px = X(x), py = Y(x * x); x === -3.4 ? c.moveTo(px, py) : c.lineTo(px, py); } c.stroke();
    const P = path.length ? path : [v('x0')];
    c.strokeStyle = css('--warn'); c.lineWidth = 1.3; c.beginPath();
    P.forEach((x, i) => { const cx = clamp(x, -3.4, 3.4); i ? c.lineTo(X(cx), Y(Math.min(cx * cx, 11.5))) : c.moveTo(X(cx), Y(Math.min(cx * cx, 11.5))); }); c.stroke();
    P.forEach((x, i) => { const cx = clamp(x, -3.4, 3.4); c.fillStyle = i === P.length - 1 ? css('--warn') : '#fbbf2455'; c.beginPath(); c.arc(X(cx), Y(Math.min(cx * cx, 11.5)), i === P.length - 1 ? 7 : 3.5, 0, 7); c.fill(); });
  };
  const finish = () => {
    const x = path[path.length - 1], e = x * x, lr = v('lr');
    $('[data-o=e]', el).textContent = e > 999 ? '> 999' : fmt(e);
    $('[data-o=msg]', el).innerHTML = lr >= 1 ? callout('bad', 'Está quicando', 'Cada passo passa do ponto e cai do outro lado do vale. No caderno isso aparece como perda que sobe, oscila ou vira NaN. Remédio: dividir a taxa.')
      : e < .05 ? callout('ok', 'Chegou ao fundo', 'Passo e épocas combinaram. Repare que os passos encurtam sozinhos conforme o chão fica plano.')
        : callout('warn', 'Parou no meio do caminho', 'Acabaram as épocas antes do fundo. O treino termina sem erro na tela e sem ter aprendido quase nada. Aumente as épocas ou o passo.');
  };
  const go = () => {
    clearInterval(timer); path = [v('x0')]; const lr = v('lr'), n = v('ep'); let t = 0;
    timer = setInterval(() => { const x = path[path.length - 1]; path.push(x - lr * 2 * x); t++; $('[data-o=t]', el).textContent = t; $('[data-o=e]', el).textContent = fmt(Math.min(999, path[t] ** 2)); draw(); if (t >= n) { clearInterval(timer); finish(); } }, Math.max(40, 1500 / n));
  };
  el.addEventListener('click', e => {
    if (e.target.dataset.a === 'go') go();
    if (e.target.dataset.a === 'rs') { clearInterval(timer); path = []; $('[data-o=t]', el).textContent = 0; $('[data-o=e]', el).textContent = '—'; $('[data-o=msg]', el).innerHTML = ''; draw(); }
    if (e.target.dataset.p) { const [lr, ep] = e.target.dataset.p.split(','); $('[data-k=lr]', el).value = lr; $('[data-k=ep]', el).value = ep; $('[data-k=x0]', el).value = -2.4; go(); }
  });
  el.addEventListener('input', () => { clearInterval(timer); path = []; draw(); });
  reg(draw);
};

      : p > 100000 && d < .2 ? callout('bad', 'Muita rede, pouco freio', `${p.toLocaleString('pt-BR')} pesos para uma tabela de milhares de linhas. Sem dropout, essa rede decora o treino: a validação vai subir enquanto o treino desce.`)
        : p > 100000 ? callout('ok', 'Proporção razoável', `Com dropout de ${fmt(d)}, cerca de ${drop} dos ${n} neurônios de cada camada ficam de fora a cada passagem, e a rede aprende a não depender de nenhum.`)

LABS.hiper = el => {

LABS.aumento = el => {
  el.innerHTML = `<p class="lead">Com poucas imagens, mostra-se a mesma foto várias vezes, cada vez um pouco diferente. Mexa — e depois <b>quebre a regra</b>.</p>

  <div><div class="muted" style="font-size:12px">TREINO · cada época vê uma versão</div><div data-o="tr" style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px"></div>

  const src = document.createElement('canvas'); src.width = src.height = 224; drawLeaf(src.getContext('2d'), 224);
  let r = rng(5);
  const tile = aug => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 96; cv.style.cssText = 'width:84px;height:84px;border-radius:8px;border:1px solid var(--line)';
    const c = cv.getContext('2d');
    if (aug) {

      const bmax = +$('[data-k=b]', el).value / 100, br = 1 + (r() * 2 - 1) * (bmax - 1);
      c.filter = `brightness(${br})`;
      if ($('[data-k=f]', el).checked && r() < .5) { c.translate(96, 0); c.scale(-1, 1); }
      c.drawImage(src, x, y, w, w, 0, 0, 96, 96);
    } else c.drawImage(src, 0, 0, 96, 96);
    return cv;
  };
  const up = () => {
    $('[data-v=c]', el).textContent = $('[data-k=c]', el).value + '%'; $('[data-v=b]', el).textContent = $('[data-k=b]', el).value + '%';

      : any ? callout(+$('[data-k=c]', el).value < 65 || +$('[data-k=b]', el).value > 150 ? 'warn' : 'ok', 'O aumento vai só no treino', 'A cada época o modelo vê uma versão diferente e não consegue decorar a foto. Cuidado com o exagero: distorção demais ensina coisas que não existem no campo.')
        : callout('', 'Sem aumento', 'A foto como ela é. Com poucos milhares de imagens e milhões de pesos, o modelo tende a guardar as fotos em vez de aprender o que elas têm em comum.');
  };

const TOKN = [['DistilBERT multilíngue', '119 mil', 'Fala 104 idiomas e nenhum muito bem. Parte muito o português.'], ['BERTimbau', '30 mil', 'Treinado só em português brasileiro. Conhece palavras nossas inteiras.'], ['XLM-RoBERTa', '250 mil', 'Generalista em cem idiomas. Vocabulário gigante — é dele boa parte do peso.']];
const toks = a => a.map(t => `<span class="tok ${t.startsWith('##') ? 'sub' : ''}">${t}</span>`).join('');
LABS.tokens = el => {
  el.innerHTML = `<p class="lead">Na Fase 1 o texto virava número contando palavras de uma lista fechada: palavra nunca vista sumia. Agora o texto é partido em <b>pedaços de palavra</b>. Troque a frase.</p>
  ${seg('f', ['frase comum', 'com erro de digitação', 'com gíria'])}<div data-o="o"></div>`;
  const up = () => {
    const f = FR[segVal(el, 'f')];
    const words = f.t.replace(/,/g, '').split(' ');
    $('[data-o=o]', el).innerHTML = `<div class="card" style="background:var(--bg);margin-bottom:10px"><div class="kicker" style="--c:var(--bad)">Fase 1 · contando palavras</div><div style="margin:6px 0">${words.map(w => `<span class="tok ${f.drop.includes(w) ? 'drop' : ''}">${w}</span>`).join('')}</div>
    <small class="${f.drop.length ? 'badb' : 'muted'}">${f.drop.length} palavra(s) jogada(s) fora por não estarem na lista. Com elas, vai embora o sentido.</small></div>
    ${TOKN.map((n, i) => `<div class="card" style="background:var(--bg);margin-bottom:8px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><b>${n[0]}</b><span class="muted" style="font-size:12.5px">${f.tk[i].length} pedaços · vocabulário de ${n[1]}</span></div><div style="margin:6px 0">${toks(f.tk[i])}</div><small class="muted">${n[2]}</small></div>`).join('')}
    ${callout('ok', 'Nenhuma palavra jogada fora', 'O modelo entende uma palavra que nunca viu porque entende as partes (os pedaços com ## continuam a palavra anterior). Cada pedaço a mais, porém, gasta espaço do limite de 128. Vocabulário maior não significa partir menos — significa cobrir mais idiomas.')}`;
  };
  bindSeg(el, 'f', up); up();
};

LABS.limite = el => {
  const T = [[32, 92], [64, 58], [96, 30], [128, 14], [192, 5], [256, 2], [384, .5], [512, 0]];
  el.innerHTML = `<p class="lead">O modelo lê um número fixo de pedaços por texto e <b>corta o resto</b>. Mover essa linha tem preço dos dois lados.</p>
  ${sl('l', 'limite (max_length)', 32, 512, 16, 128)}
  <div class="stats"><div class="stat"><small>Textos que perdem parte no corte</small><b data-o="c"></b><div class="bar"><i data-o="cb" style="background:var(--bad)"></i></div></div><div class="stat"><small>Custo de cada passo (vs 128)</small><b data-o="k"></b><div class="bar"><i data-o="kb" style="background:var(--warn)"></i></div></div></div>
  <div class="legend">O custo de cada passo cresce com o QUADRADO do limite.</div><div data-o="msg"></div>`;
  const up = () => {
    const l = +$('[data-k=l]', el).value, c = lerp(T, l), k = (l / 128) ** 2;
    $('[data-v=l]', el).textContent = l + ' pedaços'; $('[data-o=c]', el).textContent = pct(c, 0); $('[data-o=cb]', el).style.width = c + '%';
    $('[data-o=k]', el).textContent = '× ' + fmt(k, k < 1 ? 2 : 1); $('[data-o=kb]', el).style.width = Math.min(100, k / 16 * 100) + '%';
    $('[data-o=msg]', el).innerHTML = l < 96 ? callout('bad', 'Curto demais', 'Boa parte dos textos perde o fim — e o fim costuma ser onde está a conclusão. Em pares de frases é fatal: se a segunda for cortada, o modelo decide sem ter lido o que precisava comparar.')
      : l <= 160 ? callout('ok', 'O meio-termo', '128 é o padrão do caderno porque cobre a grande maioria dos textos e mantém o treino rápido. O ponto não é decorar o 128: ele foi MEDIDO olhando quantos textos do corpus cabem.')
        : callout('warn', 'Longo demais', 'Quase nada é cortado, e cada passo de treino fica caríssimo. Vocês vão esperar muito para ganhar pouco. A decisão certa depende do corpus de vocês.');
  };
  $('[data-k=l]', el).oninput = up; up();
};

LABS.hiperTxt = el => {
  const LR = ['5e-6', '1e-5', '2e-5', '5e-5', '1e-4', '1e-3'], F1 = [.82, .89, .90, .89, .70, .38];
  el.innerHTML = `<p class="lead">Quatro botões: taxa, épocas, limite e aquecimento. Mexa um por vez.</p>
  <div class="row"><div><div class="muted" style="font-size:13px">taxa de aprendizado</div>${seg('lr', LR, 2)}${sl('e', 'épocas', 1, 8, 1, 3)}${sl('w', 'aquecimento (warmup)', 0, 20, 5, 10)}
  <div class="muted" style="font-size:13px">limite</div>${seg('l', ['64', '128', '256'], 1)}</div>
  <div style="flex:1.4 1 300px"><canvas class="ch"></canvas>${LEG}<div class="stats"><div class="stat"><small>Melhor F1 na placa</small><b data-o="f"></b></div><div class="stat"><small>Tempo</small><b data-o="t"></b></div></div></div></div><div data-o="msg"></div>`;
  const cv = $('canvas', el);
  const up = () => {
    const li = segVal(el, 'lr'), e = +$('[data-k=e]', el).value, w = +$('[data-k=w]', el).value, l = segVal(el, 'l');
    $('[data-v=e]', el).textContent = e; $('[data-v=w]', el).textContent = w + '%';
    const n = e * 4, p = { n: Math.max(2, n), start: 1, floor: .25, k: .55, gap: .06, over: 1.3, turn: 11, seed: 51 };
    if (li >= 5) Object.assign(p, { floor: .75, noise: .14, rise: .01, over: 0 }); else if (li === 4) Object.assign(p, { floor: .45, noise: .07 }); else if (li === 0) Object.assign(p, { k: .12 });
    if (w === 0) p.warm = .6;
    const cu = curves(p);
    curveChart(cv, cu, { xlabel: `${e} época(s) → (4 medições por época)`, v: e > 3 ? [{ i: 11, label: 'fim da 3ª época' }] : [], dots: [{ i: cu.best, v: cu.va[cu.best], c: css('--ok'), label: 'melhor ponto' }] });
    const f1 = F1[li] - (l === 0 ? .04 : 0) - (w === 0 ? .01 : 0) - (e < 2 ? .06 : 0);
    $('[data-o=f]', el).textContent = fmt(f1); $('[data-o=t]', el).textContent = '~' + Math.round(14 / 3 * e * [.5, 1, 4][l]) + ' min';
    $('[data-o=msg]', el).innerHTML = li >= 5 ? callout('bad', 'Passo grande demais', 'Mil vezes acima da faixa (1e-5 a 5e-5). Apaga o pré-treino nas primeiras centenas de passos: o que sobra não sabe português nem a tarefa.')
      : e > 3 ? callout('warn', 'Épocas demais', 'Repare onde caiu o ponto verde: cedo. O modelo já sabia português — o ajuste fino não ensina a língua, ensina a tarefa. É pouca coisa, e passar do ponto estraga rápido. Três épocas bastam; a quarta costuma estragar.')
        : w === 0 ? callout('warn', 'Sem aquecimento', 'A primeira época sai pior: o modelo leva passos de tamanho cheio antes de se orientar. O aquecimento começa com passos minúsculos e vai crescendo — o XLM-R é quem mais sofre sem ele.')
          : l === 2 ? callout('warn', 'Limite 256', 'Quase nada é cortado, mas cada passo custa ~4× mais (quadrado do limite). Ganho pequeno.')
            : callout('ok', 'Faixa de trabalho', 'Três épocas, taxa 2e-5, limite medido no Bloco 1 e aquecimento de 10%. Guardem como referência.');
  };
  el.addEventListener('input', up); ['lr', 'l'].forEach(k => bindSeg(el, k, up)); reg(up);
};

LABS.medias = el => {
  el.innerHTML = `<p class="lead">Um modelo que responde <b>sempre a classe maior</b> e nunca acerta a menor (2 classes). Que nota cada média dá a ele? Arraste o desequilíbrio.</p>
  ${sl('p', 'classe maior', 50, 99, 1, 70)}<div class="stats"><div class="stat"><small>F1-macro · principal</small><b data-o="a" style="color:var(--acc)"></b><div class="bar"><i data-o="ab"></i></div></div><div class="stat"><small>F1-micro (= acurácia)</small><b data-o="b"></b><div class="bar"><i data-o="bb" style="background:var(--a3)"></i></div></div><div class="stat"><small>F1 ponderado</small><b data-o="c"></b><div class="bar"><i data-o="cb" style="background:var(--warn)"></i></div></div></div>
  <ul class="muted" style="font-size:14px"><li><b>F1-macro</b> — média simples: a classe pequena pesa igual à grande. Ordena o ranking nas três trilhas.</li><li><b>F1-micro</b> — junta tudo num bolo só.</li><li><b>F1 ponderado</b> — pondera pelo tamanho de cada classe.</li><li><b>Recall</b> (apoio) — dos casos que existiam, quantos o modelo encontrou. Só desempata: senão bastaria responder a classe positiva em tudo.</li></ul><div data-o="msg"></div>`;
  const up = () => {
    const p = +$('[data-k=p]', el).value / 100, f = 2 * p / (1 + p), ma = f / 2, mi = p, po = p * f;
    $('[data-v=p]', el).textContent = Math.round(p * 100) + '%';
    [['a', ma], ['b', mi], ['c', po]].forEach(([k, v]) => { $(`[data-o=${k}]`, el).textContent = fmt(v); $(`[data-o=${k}b]`, el).style.width = v * 100 + '%'; });
    $('[data-o=msg]', el).innerHTML = p >= .9 ? callout('bad', 'O modelo preguiçoso fica bonito', `Com ${Math.round(p * 100)}% numa classe só, ele tira ${fmt(mi)} de micro e ${fmt(po)} de ponderado. O macro desmascara: ${fmt(ma)}.`) : callout('warn', 'As médias já discordam', 'Quanto mais desbalanceado, mais o micro e o ponderado premiam quem só acerta a classe grande. Arraste até 95% e veja a distância abrir.');
  };
  $('[data-k=p]', el).oninput = up; up();
};

      { id: 'a1q1', q: 'O modelo já vem treinado por outra equipe. O que o treino de vocês por cima NÃO consegue apagar?', o: ['A inclinação que ele herdou do material de treino original', 'O nome do arquivo de pesos', 'A arquitetura da última camada', 'O tamanho do lote'], a: 0, e: 'Ele herda o que estava torto no material original, e o ajuste por cima não desfaz isso. Por isso o relatório precisa falar da origem dos pesos.' },
      { id: 'a1q2', q: 'A métrica geral deu 78%. Por que isso pode não bastar no relatório?', o: ['Porque 78% é sempre pouco', 'Porque a média pode esconder um grupo inteiro indo mal', 'Porque a métrica geral não existe em redes neurais', 'Porque falta calcular a média de novo'], a: 1, e: 'Laboratório 1: a média fica bonita (78,5%) enquanto um grupo vai a 47%. Desempenho por grupo é o que revela.' },
      { id: 'a1q3', q: 'O backpropagation descobre o quê, exatamente?', o: ['O tamanho do passo que cada peso deve dar', 'A direção para onde cada peso precisa ir', 'A quantidade de épocas necessária', 'Qual classe está certa'], a: 1, e: 'Ele descobre a direção. O tamanho do passo é a taxa de aprendizado — decisão de vocês.' },
      { id: 'a1q4', q: 'Por que um modelo grande e já treinado precisa de uma taxa de aprendizado minúscula?', o: ['Porque ele é lento', 'Para não estragar o que ele já sabia', 'Porque a placa de vídeo exige', 'Para caber na memória'], a: 1, e: 'Passo grande num modelo já treinado destrói o que ele aprendeu com milhões de fotos.' },
      { id: 'a1q5', q: 'A sessão caiu no meio do treino e não havia ponto de verificação. O que vocês perdem?', o: ['Nada, o treino continua de onde parou', 'Só a última época', 'Tudo: o treino recomeça do zero', 'Só os dados, o modelo fica'], a: 2, e: 'Sem ponto de verificação não existe cópia salva. Salvem a cada época.' },
      { id: 'a1q6', q: 'Qual é a faixa de taxa de aprendizado dos modelos desta fase?', o: ['De 0,00001 a 0,02', 'De 0,01 a 1', 'De 0,1 a 0,5', 'Sempre 0,01'], a: 0, e: 'De 0,00001 a 0,02 — mil vezes de diferença. A ficha de cada modelo diz qual usar.' },
      { id: 'a1q7', q: 'A IA respondeu: "Use 0.01, é o valor padrão para ajustar o EfficientNet-B0". Qual o veredito?', o: ['Pode usar direto, é o padrão', 'Precisa conferir: 0.01 é o padrão de quem treina do zero', 'Pergunta errada', 'Usar 0.1 para ir mais rápido'], a: 1, e: 'O número tem cara de padrão porque é o padrão de treinar do zero. Modelo já treinado precisa de passo ~mil vezes menor. Com 0,01 vocês estragam o que ele sabia na primeira época.' },
      { id: 'a1q8', q: 'A IA explicou que "dropout de 0.3 desliga 30% dos neurônios ao acaso no treino, e na validação todos voltam". Veredito?', o: ['Errado, não usar', 'Dá para usar — e dá para conferir na documentação', 'Pergunta errada', 'Só vale se a IA citar fonte'], a: 1, e: 'Explicação conceitual correta e fácil de conferir (1 minuto na documentação). É o uso que o relatório aceita: vocês entenderam e checaram.' },
      { id: 'a1q9', q: '"Escreve o bloco de treino inteiro para mim, com tudo pronto." Qual o problema?', o: ['A IA não sabe escrever código de treino', 'É a pergunta errada: se ninguém da equipe sabe explicar linha por linha, o ponto vai embora', 'O código sempre vem com erro de sintaxe', 'Não há problema algum'], a: 1, e: 'Não é sobre a resposta estar certa. É sobre quem vai explicar o código na avaliação — e sobre a equipe aprender o que a fase pede.' },
      { id: 'a1q10', q: 'Neurônio com x = (0,8; 0,3), w = (1,0; −0,5), b = 0 e ReLU. Qual a saída?', o: ['0,65', '0,95', '0,25', '0'], a: 0, e: 'z = 0,8×1 + 0,3×(−0,5) + 0 = 0,80 − 0,15 = 0,65. ReLU(0,65) = 0,65.' },
      { id: 'a1q11', q: 'O mesmo neurônio, agora com b = −0,9 e ReLU. Qual a saída?', o: ['−0,25', '0', '0,25', '0,9'], a: 1, e: 'z = 0,65 − 0,9 = −0,25. A ReLU zera tudo que é negativo: saída 0 (neurônio desligado).' },
      { id: 'a1q12', q: 'O que acontece ao empilhar duas camadas SEM função de ativação?', o: ['A rede fica duas vezes mais inteligente', 'O resultado é o mesmo de uma camada só', 'A rede vira classificação', 'O treino fica mais estável'], a: 1, e: 'Duas camadas lineares equivalem a uma: você paga o dobro e não ganha nada. É a ativação que faz a profundidade valer a pena.' },
      { id: 'a1q13', q: 'Ao trocar a tarefa de classificação para regressão, o que muda no fim da rede?', o: ['Ganha mais um softmax', 'A última camada passa a ter um neurônio só, sem softmax', 'Perde as camadas escondidas', 'Nada muda'], a: 1, e: 'Na regressão o número que sai já é a resposta (preço, temperatura). A tarefa decide como a rede termina.' },
      { id: 'a1q14', q: 'Para que serve o softmax na saída da classificação?', o: ['Desligar neurônios', 'Transformar as saídas em porcentagens que somam 100%', 'Aumentar a taxa de aprendizado', 'Salvar o modelo'], a: 1, e: 'A classe escolhida é a de maior porcentagem.' },
      { id: 'a1q15', q: 'A perda sobe, oscila ou vira NaN durante o treino. Qual a causa mais provável e o remédio?', o: ['Taxa pequena demais — aumentar', 'Taxa grande demais — dividir a taxa', 'Poucas épocas — aumentar', 'Falta de GPU'], a: 1, e: 'A "bolinha está quicando": cada passo passa do ponto. Divida a taxa.' },
      { id: 'a1q16', q: 'O treino terminou sem erro nenhum, mas o modelo quase não aprendeu e a perda mal desceu. Provável causa?', o: ['Taxa grande demais', 'Taxa pequena demais / épocas insuficientes', 'Dropout zero', 'Sessão caiu'], a: 1, e: 'Passos curtos demais: as épocas acabam antes de chegar ao fundo do vale.' },
      { id: 'a1q17', q: 'Com 300 imagens de treino, qual a diferença típica entre partir de pesos prontos e treinar do zero?', o: ['Nenhuma', '~70% contra ~30%', '~30% contra ~70%', '~99% contra ~98%'], a: 1, e: '69,9% contra 29,5%: o pré-treinado já sabe o que é borda, textura e brilho.' },
      { id: 'a1q18', q: 'O que o AdamW faz de diferente de um otimizador simples?', o: ['Guarda memória dos passos anteriores: acelera onde a descida é consistente e freia onde fica irregular', 'Salva o modelo a cada época', 'Desliga neurônios', 'Escolhe o número de épocas'], a: 0, e: '"Um anda de olhos vendados contando passos. O outro lembra por onde já veio."' },
      { id: 'a1q19', q: 'Qual peça diminui o tamanho do passo ao longo do treino?', o: ['Otimizador', 'Agendador', 'Parada antecipada', 'Ponto de verificação'], a: 1, e: 'Começa grande para cobrir distância e encurta para não passar do ponto no fim.' },
      { id: 'a1q20', q: 'Sem ponto de verificação, a parada antecipada entrega qual modelo?', o: ['O da melhor época', 'O de quando já estava piorando (última época treinada)', 'O da primeira época', 'Nenhum'], a: 1, e: 'A parada só acontece depois de algumas épocas sem melhora — os pesos na memória já são piores. O checkpoint guarda a melhor.' },
      { id: 'a1q21', q: 'Esqueceram de ligar a GPU. O que acontece?', o: ['O código dá erro imediatamente', 'Roda igual, sem mensagem de erro, só ~20× mais lento', 'O modelo fica menos preciso', 'A sessão cai'], a: 1, e: '4 min por época em vez de 11 s: 1 h 20 de espera. Confiram o ambiente antes de treinar.' },
      { id: 'a1q22', q: 'Quantos números (pesos) tem o modelo emprestado e em quantos botões vocês mexem?', o: ['86 mil e 10 botões', '86 milhões e quatro botões', '1 milhão e todos os pesos', '25 milhões e nenhum botão'], a: 1, e: 'Vocês não mexem nos 86 milhões: mexem em quatro botões.' },
    ]
  },
  {
    id: 'a2', n: 2, c: 'var(--a2)', t: 'Dados tabulares', s: 'Piso, sinal, três modelos, as três células e a leitura das curvas',
    ideias: [['Bloco 1 · Explorar', 'Três números para anotar: o PISO (F1-macro do chute preguiçoso), as 3 colunas de maior sinal e QUANTOS VALORES tem cada categoria (obrigatório).'], ['Por que F1-macro', 'A acurácia premia o chute preguiçoso em problemas desequilibrados. O F1-macro dá o mesmo peso à classe pequena.'], ['Vazamento', 'Uma coluna que sozinha explica quase tudo quase sempre é vazamento: informação que só existe depois do rótulo.'], ['Três modelos', 'Rede densa (get_dummies + régua obrigatória), com embeddings (índices + cardinalidades), TabNet (idx_cat + dim_cat, sem régua).'], ['Três células', 'A prepara, B treina (lacunas + Zona Livre), C avalia (vem pronta: é para ler).'], ['A régua', 'StandardScaler ajustado SÓ no treino, depois da separação. Antes = vazamento sem mensagem de erro.'], ['Zona Livre', 'Quem só preenche as lacunas tem resultado mediano. Um ajuste por vez, anotando o efeito.'], ['As curvas', 'A curva de validação é a que importa. Saudável, sobreajuste, subajuste e taxa alta têm formatos diferentes.']],
    labs: [['piso', 'Antes de treinar, descubram o piso'], ['sinal', 'Alguma coluna aqui ajuda?'], ['corr', 'Duas colunas que contam a mesma coisa'], ['params', 'A rede por dentro'], ['hiper', 'Os hiperparâmetros e as curvas'], ['preparos', 'O mesmo dado, três preparos'], ['laco', 'O caminho que o código percorre'], ['quatro', 'Quatro peças cuidam do treino'], ['regua', 'O erro que não dá erro: a régua'], ['zona', 'A Zona Livre da célula B'], ['filme', 'Perda de treino e de validação'], ['matriz3', 'Onde o erro mora'], ['custo', 'Custo contra ganho']],
    levar: ['Descubram o piso antes de treinar qualquer coisa.', 'Cada modelo quer a entrada de um jeito.', 'A Zona Livre é onde o resultado deixa de ser mediano.', 'A curva de validação é a que importa.', 'Sem ponto de verificação, entra na entrega a última época.'],
    quiz: [
      { id: 'a2q1', q: 'O que é o "piso" que se mede no Bloco 1?', o: ['O F1-macro de um modelo que responde sempre a classe mais comum', 'A menor perda de treino', 'O número mínimo de colunas', 'A nota da Fase 1'], a: 0, e: 'É a nota que o modelo precisa superar para ter aprendido alguma coisa. Sem ela, um F1 de 0,30 pode ser bom ou desastre.' },
      { id: 'a2q2', q: 'Com 92% numa classe (2 classes), o chute preguiçoso tira 92% de acurácia e quanto de F1-macro?', o: ['92%', '~48%', '~8%', '~74%'], a: 1, e: 'F1 da classe maior = 2·0,92/1,92 ≈ 0,96; da menor = 0. Média: ≈ 0,48. Por isso o ranking usa F1-macro.' },
      { id: 'a2q3', q: 'Uma coluna sozinha tem sinal 0,93 e as outras ficam abaixo de 0,15. O que suspeitar?', o: ['Ótimo, achamos a coluna perfeita', 'Vazamento: informação que só existe depois do rótulo', 'Problema sem sinal', 'Falta de régua'], a: 1, e: 'Quase nunca é sorte. Achar no 1º dia poupa a semana; no último, é refazer tudo.' },
      { id: 'a2q4', q: '"energia" e "volume" têm correlação 0,74. Qual o efeito principal?', o: ['O modelo trava', 'Atrapalham a leitura de importância: o peso se divide entre as duas', 'Aumentam muito a acurácia', 'Precisam virar colunas de 0 e 1'], a: 1, e: 'Informação repetida não soma. Não atrapalha o modelo, mas nenhuma das duas parece importante no gráfico de importância.' },
      { id: 'a2q5', q: 'Qual número do Bloco 1 é obrigatório, senão dois dos três modelos nem rodam?', o: ['O piso', 'Quantos valores diferentes tem cada categoria (cardinalidade)', 'A correlação máxima', 'O número de linhas'], a: 1, e: 'A rede com embeddings precisa do tamanho de cada tabela de consulta e o TabNet precisa de duas listas (posições e tamanhos).' },
      { id: 'a2q6', q: 'Por que, na rede densa, as categorias viram colunas de 0 e 1?', o: ['Para economizar memória', 'Porque o número da categoria não tem ordem (gênero 7 não é "maior" que gênero 3)', 'Porque o TabNet exige', 'Para aplicar a régua'], a: 1, e: 'Tratar o código como número inventaria uma ordem que não existe (tonalidade, inclusive, é um ciclo).' },
      { id: 'a2q7', q: 'Por que a régua (padronização) é obrigatória na rede densa?', o: ['Porque a rede soma tudo junto: uma coluna que vai até 200 dominaria outra que vai até 1', 'Porque acelera a GPU', 'Para remover outliers', 'Não é obrigatória'], a: 0, e: 'Escalas diferentes fazem uma coluna dominar sem ter mais importância. É a única das três que não perdoa isso.' },
      { id: 'a2q8', q: 'Na rede com embeddings, a régua se aplica a quais colunas?', o: ['A todas', 'Só às numéricas', 'Só às categóricas', 'A nenhuma'], a: 1, e: 'Padronizar um índice de categoria destrói justamente a informação que o embedding vai usar.' },
      { id: 'a2q9', q: 'Qual é a pegadinha do TabNet que quebra o treino na hora de rodar?', o: ['virtual_batch_size precisa dividir exatamente batch_size', 'Precisa de régua', 'Não aceita categorias', 'Precisa de 1000 épocas'], a: 0, e: 'Ex.: batch_size=1024 e virtual_batch_size=128. É exigência da biblioteca, não um conceito de ML.' },
      { id: 'a2q10', q: 'No TabNet, idx_cat e dim_cat são, respectivamente:', o: ['tamanhos e posições', 'posições das colunas de categoria e quantos valores cada uma tem', 'taxas e épocas', 'nomes e tipos'], a: 1, e: 'Trocar uma pela outra é o engano mais comum: aparece como índice fora da tabela, ou modelo que treina e não aprende.' },
      { id: 'a2q11', q: 'A régua foi ajustada na tabela inteira antes de separar treino e validação. O que acontece?', o: ['Dá erro de execução', 'Vazamento: a validação melhora e a plataforma piora, sem mensagem de erro', 'Nada, é equivalente', 'O treino fica mais lento'], a: 1, e: 'Exemplo do aulão: 0,81 na validação, 0,69 na plataforma. A ordem certa deu 0,76 / 0,75 — a nota menor é a verdadeira.' },
      { id: 'a2q12', q: 'Qual a ordem correta do laço de treino por lote?', o: ['backward → zero_grad → step → forward → perda', 'zero_grad → forward (modelo(lote)) → perda → backward → step', 'forward → step → perda → backward → zero_grad', 'perda → forward → zero_grad → step → backward'], a: 1, e: 'Apaga o passo anterior, faz o palpite, mede o erro, propaga para trás, anda. Inverter produz um treino que roda e não aprende.' },
      { id: 'a2q13', q: 'O que acontece se esquecer o otimizador.zero_grad()?', o: ['Nada', 'Os gradientes se acumulam entre lotes e o modelo anda na direção errada', 'O treino para', 'A perda vira zero'], a: 1, e: 'É a etapa que "parece não fazer nada" — mas sem ela os ajustes de lotes anteriores se somam aos novos.' },
      { id: 'a2q14', q: 'Em qual linha do laço o modelo muda de verdade?', o: ['erro.backward()', 'otimizador.step()', 'modelo(lote)', 'perda(saida, resposta)'], a: 1, e: 'Os quatro passos anteriores calculam; o step aplica.' },
      { id: 'a2q15', q: 'Taxas recomendadas: rede densa do zero e TabNet são, respectivamente:', o: ['1e-3 e 2e-2', '2e-2 e 1e-3', '1e-5 e 1e-5', '0,1 e 0,01'], a: 0, e: 'O TabNet foi feito para começar rápido e ir freando: 20× a taxa da densa. Copiar a taxa do vizinho é erro comum.' },
      { id: 'a2q16', q: 'Tamanho de embedding que costuma bastar:', o: ['8', '512', '1', '128'], a: 0, e: 'Dar 24 números a uma coluna de 2 valores só acrescenta parâmetro para decorar.' },
      { id: 'a2q17', q: 'Rede com 12 entradas, 1 camada escondida de 16 e 3 saídas. Quantos pesos (com deslocamentos)?', o: ['259', '208', '31', '576'], a: 0, e: '(12×16 + 16) + (16×3 + 3) = 208 + 51 = 259.' },
      { id: 'a2q18', q: 'Por que o número de parâmetros cresce muito mais rápido que a largura?', o: ['Porque cada camada se liga inteira à seguinte (n×n)', 'Por causa do dropout', 'Por causa da régua', 'Não cresce'], a: 0, e: '4 camadas de 512 → 796.163 pesos. Capacidade sobrando é convite ao sobreajuste e precisa de freio.' },
      { id: 'a2q19', q: 'Zona Livre: qual é o método que permite saber a qual decisão o ganho pertence?', o: ['Mudar tudo de uma vez', 'Um ajuste por vez, anotando o efeito', 'Copiar a configuração de outra equipe', 'Aumentar sempre a rede'], a: 1, e: 'Assim dá para voltar atrás no que piorou (como a rede enorme sem dropout, que caiu para 0,64).' },
      { id: 'a2q20', q: 'Por que "peso por classe" costuma render bastante nesta fase?', o: ['Porque acelera o treino', 'Porque a métrica é o F1-macro e a classe menor deixa de ser sacrificada', 'Porque reduz parâmetros', 'Porque substitui o dropout'], a: 1, e: 'No laboratório levou de 0,76 para 0,79.' },
      { id: 'a2q21', q: 'Na matriz de confusão, por que ler em "proporção da linha"?', o: ['Porque fica mais bonito', 'Porque iguala as classes: 40 erros numa classe grande podem ser menos graves que 12 numa pequena', 'Porque a contagem está sempre errada', 'Porque a diagonal some'], a: 1, e: 'Em contagem as classes grandes dominam e as pequenas quase desaparecem.' },
      { id: 'a2q22', q: 'Rede densa 0,76 em 2 min, embeddings 0,78 em 5 min, TabNet 0,79 em 11 min. Quando o TabNet se justifica?', o: ['Sempre, é o maior número', 'Quando o relatório vai usar a explicação de quais colunas ele olhou', 'Nunca', 'Quando não há GPU'], a: 1, e: 'Um centésimo por 5× o tempo: a resposta honesta depende do tempo que sobrou e do uso da interpretabilidade.' },
      { id: 'a2q23', q: 'O que é a célula C do caderno?', o: ['Preparo dos dados', 'Treino com lacunas', 'Avaliação: vem pronta, sem lacuna — é para ler', 'Zona Livre'], a: 2, e: 'A prepara, B constrói e treina, C avalia. O laço de treino da B também já vem escrito.' },
      { id: 'a2q-c1', t: 'curve', cv: 'sobre', q: 'Diagnostique este treino:', o: ['Treino saudável', 'Sobreajuste', 'Subajuste', 'Taxa alta demais'], a: 1, e: 'Treino despenca e validação sobe: decorou. Remédio: parada antecipada, mais dropout, rede menor ou mais dados.' },
      { id: 'a2q-c2', t: 'curve', cv: 'sub', q: 'Diagnostique este treino:', o: ['Treino saudável', 'Sobreajuste', 'Subajuste', 'Taxa alta demais'], a: 2, e: 'As duas param altas e juntas. Aumentem a capacidade, a taxa ou as épocas — e confiram se a régua foi aplicada.' },
      { id: 'a2q-c3', t: 'curve', cv: 'alta', q: 'Diagnostique este treino:', o: ['Treino saudável', 'Sobreajuste', 'Subajuste', 'Taxa alta demais'], a: 3, e: 'Serrilhada e subindo. Dividam a taxa por dez — é sempre a primeira coisa a tentar.' },
      { id: 'a2q-c4', t: 'curve', cv: 'baixa', q: 'As curvas são lisas e a melhor época é a última. Diagnóstico?', o: ['Taxa baixa demais', 'Sobreajuste', 'Taxa alta demais', 'Vazamento'], a: 0, e: 'O sintoma da taxa baixa é lentidão, não instabilidade: ainda havia ganho disponível. Multipliquem a taxa por dez.' },
      { id: 'a2q-k1', t: 'code', q: 'Complete a célula A da rede densa:', code: '<span class="cm"># categoria vira coluna de 0 e 1: o número não tem ordem</span>\nX = pd.[[0]](X, columns=categoricas)\n<span class="cm"># separa mantendo a proporção das classes</span>\nX_tr, X_va, y_tr, y_va = train_test_split(X, y, test_size=0.2, stratify=[[1]])\n<span class="cm"># a régua aprende média e desvio SÓ no treino</span>\nregua = StandardScaler().fit([[2]])', b: [['get_dummies', 'factorize', 'concat'], ['y', 'X', 'None'], ['X_tr', 'X', 'X_va']], e: 'get_dummies abre as categorias; stratify=y mantém a proporção; a régua é ajustada em X_tr (ajustar em X é o vazamento silencioso).' },
      { id: 'a2q-k2', t: 'code', q: 'Complete a célula B da rede densa:', code: '<span class="cm"># dropout é o freio do sobreajuste desta rede</span>\nmodelo = RedeDensa(entradas=X_tr.shape[1], saidas=3, dropout=[[0]])\n<span class="cm"># quem move os pesos depois que o erro apontou a direção</span>\notimizador = [[1]](modelo.parameters(), lr=[[2]])\n<span class="cm"># o passo vai encurtando ao longo do treino</span>\nagendador = [[3]](otimizador, T_max=60)\n<span class="cm"># guarda a melhor época, não a última</span>\ntreino = Config(epocas=60, parada_antecipada=10, ponto_de_verificacao=[[4]])', b: [['0.3', '0.9', '0.0'], ['AdamW', 'StandardScaler', 'Dropout'], ['1e-3', '1e-6', '1.0'], ['CosineAnnealingLR', 'train_test_split', 'get_dummies'], ['True', 'False', 'None']], e: 'Dropout 0,3, AdamW com lr 1e-3, agendador CosineAnnealingLR e ponto de verificação ligado.' },
      { id: 'a2q-k3', t: 'code', q: 'Complete a célula B do TabNet:', code: '<span class="cm"># n_steps é quantas vezes ele decide quais colunas olhar</span>\nmodelo = TabNetClassifier(cat_idxs=[[0]], cat_dims=dim_cat, n_steps=5,\n    optimizer_params=dict(lr=[[1]]))\n<span class="cm"># o lote virtual precisa dividir o lote EXATAMENTE</span>\nmodelo.fit(X_tr, y_tr, batch_size=1024, virtual_batch_size=[[2]],\n    max_epochs=60, patience=10)', b: [['idx_cat', 'dim_cat', 'cardinalidades'], ['2e-2', '1e-3', '1e-5'], ['128', '100', '1000']], e: 'cat_idxs recebe as posições (idx_cat); a taxa do TabNet é 2e-2; 1024 / 128 = 8 (divide exato — 100 e 1000 não dividem).' },
    ]
  },
  {
    id: 'a3', n: 3, c: 'var(--a3)', t: 'Visão computacional', s: 'Resolução, aumento de dados, três modelos, dois estágios e o mapa de atenção',

/* botão de confirmação dentro da página (o visualizador bloqueia confirm()) */
function confirmBtn(btn, ask, fn) {
  const label = btn.textContent;
  btn.onclick = () => {
    if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = label; fn(); return; }
    btn.dataset.armed = 1; btn.textContent = ask;
    setTimeout(() => { if (btn.isConnected && btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = label; } }, 4000);
  };
}
